[pytest]
# 测试根目录为 server/tests
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# 输出更易读
addopts = -ra --strict-markers --tb=short

# 自定义标记
markers =
    decouple: 进程生命周期解耦相关用例
    recovery: 异常恢复与状态收敛相关用例
    security: 认证鉴权与安全相关用例
    regression: 原有功能契约回归
    slow: 会真实拉起进程或等待超时，耗时较长
    source_contract: 源码契约断言（直接读取 .py 检查关键实现，对重构敏感）
